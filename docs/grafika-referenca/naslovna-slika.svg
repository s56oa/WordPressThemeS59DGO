<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040">
  <!-- Referenčna naslovna slika (Contests): stolp z Yagi antenami nad grebenom Snežnika. Brez besedila. -->
  <rect width="1600" height="1040" fill="#15304f"/>
  <!-- rahla lokatorska mreža -->
  <g stroke="#1f4470" stroke-width="2">
    <path d="M200 0V1040M400 0V1040M600 0V1040M800 0V1040M1000 0V1040M1200 0V1040M1400 0V1040"/>
    <path d="M0 200H1600M0 400H1600M0 600H1600"/>
  </g>
  <!-- sonce -->
  <circle cx="1320" cy="190" r="62" fill="#d9702a"/>
  <!-- radijski valovi -->
  <g fill="none" stroke="#b9d0e6" stroke-width="6" stroke-linecap="round">
    <path d="M700 300 A140 140 0 0 1 900 300" opacity="0.9"/>
    <path d="M640 250 A220 220 0 0 1 960 250" opacity="0.6"/>
    <path d="M580 200 A300 300 0 0 1 1020 200" opacity="0.35"/>
  </g>
  <!-- stolp -->
  <g fill="#b9d0e6">
    <rect x="788" y="330" width="24" height="470"/>
    <path d="M760 800 L840 800 L860 860 L740 860 Z"/>
    <!-- Yagi 1 -->
    <rect x="640" y="380" width="320" height="10"/>
    <rect x="660" y="352" width="10" height="66"/><rect x="720" y="358" width="10" height="54"/><rect x="780" y="362" width="10" height="46"/><rect x="840" y="366" width="10" height="38"/><rect x="900" y="370" width="10" height="30"/>
    <!-- Yagi 2 -->
    <rect x="660" y="500" width="280" height="10"/>
    <rect x="680" y="474" width="10" height="62"/><rect x="740" y="480" width="10" height="50"/><rect x="800" y="484" width="10" height="42"/><rect x="860" y="488" width="10" height="34"/><rect x="920" y="492" width="10" height="26"/>
    <!-- Yagi 3 -->
    <rect x="680" y="620" width="240" height="10"/>
    <rect x="700" y="596" width="10" height="58"/><rect x="760" y="602" width="10" height="46"/><rect x="820" y="606" width="10" height="38"/><rect x="880" y="610" width="10" height="30"/>
  </g>
  <!-- greben zadaj -->
  <path d="M0 800 L180 700 L340 760 L520 620 L680 720 L860 660 L1040 740 L1220 640 L1400 720 L1600 660 L1600 1040 L0 1040 Z" fill="#1f4470"/>
