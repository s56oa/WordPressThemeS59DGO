    <rect x="955" y="480" width="10" height="220"/>
    <rect x="880" y="530" width="160" height="6"/>
    <rect x="895" y="514" width="6" height="38"/><rect x="930" y="518" width="6" height="30"/><rect x="965" y="521" width="6" height="24"/><rect x="1000" y="524" width="6" height="18"/>
  </g>
