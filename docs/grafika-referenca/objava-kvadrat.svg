  <text x="88" y="470" font-family="IBM Plex Sans, DejaVu Sans, Arial, sans-serif" font-size="26" fill="#b9d0e6">Postavitev anten od 9. ure, delo na 144 in 432 MHz.</text>
  <!-- sonce -->
